<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event</title>
    <link rel="stylesheet" href="../css/create-event.css">
    <link rel="stylesheet" href="../css/global.css">
</head>
<body>

<div class="container">
    <div class="card">
        <!-- Heading -->
        <h2>Create Event</h2>
        <p class="subtitle">Fill in the details to publish a new event</p>

        <form id="eventForm">
            <!-- Event Title -->
            <label>Event Title</label>
            <input type="text" placeholder="e.g. Data Science Workshop">

            <!-- Upload Poster -->
            <label>Upload Poster</label>
            <div class="upload-box" id="uploadBox">
                <p id="uploadIcon">📤</p>
                <span id="uploadText">Drag & drop or click to upload</span>
                <small id="uploadInfo">JPG, PNG (Max 5MB)</small>
                <img id="preview" style="display:none; width:100%; margin-top:10px; border-radius:10px;">
            </div>
            <input type="file" id="fileInput" accept="image/*" hidden>

        

            <!-- Date and Location -->
            <div class="row">
                <div>
                    <label>Date & Time</label>
                    <input type="datetime-local">
                </div>

                <div>
                    <label>Location Type</label>
                    <select>
                        <option>On Campus</option>
                        <option>Online</option>
                    </select>
                </div>
            </div>

            <!-- Venue -->
            <label>Venue / Link</label>
            <input type="text" placeholder="e.g. Room A1, Main Hall, Microsoft Teams">

            <!-- Description -->
            <label>Description</label>
            <textarea placeholder="Add a short description..."></textarea>

            <!-- Registration -->
            <label>Registration Link (Optional)</label>
            <input type="text" placeholder="https://forms.gle/...">

            <!-- Button -->
            <button type="submit">🚀 Publish Event</button>
        </form>
    </div>
</div>

<script src="../js/create-event.js"></script>
</body>
</html>
