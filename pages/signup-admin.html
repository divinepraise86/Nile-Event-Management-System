<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration | Orbit Event Hub</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="login-container">
        <div class="login-card" style="max-width: 480px;"> <!-- Made slightly wider for the extra fields -->

            <header class="login-header">
                <img src="../assets/images/orbitsvg.svg" alt="Orbit Logo" class="login-logo">
                <h2>Admin Registration</h2>
                <p>Authorized personnel only. Please enter your details.</p>
            </header>

            <form id="signupAdminForm" class="login-form">
                <div class="input-group">
                    <label for="fullName">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="fullName" placeholder="e.g. Jane Doe" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">School Email</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" placeholder="admin@nileuniversity.edu.ng" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Create Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Min. 6 characters" required minlength="6">
                    </div>
                </div>

                <!-- NEW: Confirm Password -->
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="confirmPassword" placeholder="Retype password" required
                            minlength="6">
                    </div>
                </div>

                <!-- NEW: Secret Key -->
                <div class="input-group">
                    <label for="secretKey">Admin Secret Key</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-key"></i>
                        <input type="password" id="secretKey" placeholder="Enter authorization key" required>
                    </div>
                </div>

                <!-- Inline Error Message Container -->
                <div id="errorMessage" class="error-message" style="display: none;">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="errorText">Error message here.</span>
                </div>

                <button type="submit" class="btn-submit" id="signupBtn">
                    Create Admin Account
                </button>
            </form>

            <div class="login-footer">
                <p>Already an Admin? <a href="login-admin.html">Sign In</a></p>
            </div>

        </div>
    </div>

    <script type="module" src="../js/signup-admin.js"></script>
</body>

</html>
